name: Retrace Cross-Platform Build

# Builds and tests the Retrace components on Linux, macOS, and Windows:
#   - `slowmo`  (trace analyzer) on all three OS
#   - `dashcam` (recorder) host-test build on Linux/macOS — the recorder
#     dylib/.so itself only targets iOS/Android and is built locally via
#     scripts/prepare-qbdi.sh + dashcam/build-dashcam-*.sh (needs patched
#     QBDI static libs + Apple SDK / NDK, out of CI scope for now)
#
# slowmo is a separate CMake project that consumes dashcam's TraceFormat.h
# header-only contract and does not link against QBDI itself.
#
# Coverage matrix:
#   - ubuntu-latest   (x86_64)  — YARA + WS enabled; Triton disabled (no Triton/
#                                 Z3 package available on the runner image)
#   - macos-14        (arm64)   — YARA + WS enabled; Triton disabled (same reason)
#   - windows-latest  (x86_64)  — core build only (Triton/YARA/WS default OFF;
#                                 see CMakeLists.txt comments for why)
#
# Third-party sources are cached via actions/cache keyed on CMakeLists.txt
# hashes so FetchContent (~10+ deps: capstone, rocksdb, roaring, ftxui, fmt,
# nlohmann_json, flatbuffers, zstd, mimalloc, Catch2, ...) doesn't re-clone
# on every run.

on:
  push:
    branches:
      - main
    paths:
      - 'slowmo/**'
      - 'dashcam/**'
      - 'patches/**'
      - '.github/workflows/retrace.yml'
  pull_request:
    paths:
      - 'slowmo/**'
      - 'dashcam/**'
      - 'patches/**'
      - '.github/workflows/retrace.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config libyara-dev libz-dev

      - name: Cache ccache
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-slowmo-linux-${{ github.run_number }}
          restore-keys: |
            ccache-slowmo-linux-

      - name: Cache slowmo third-party (_deps)
        uses: actions/cache@v4
        with:
          path: slowmo/_deps
          key: slowmo-deps-v2-linux-${{ hashFiles('slowmo/CMakeLists.txt', 'slowmo/tests/CMakeLists.txt') }}

      - name: Configure
        working-directory: slowmo
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTENET_ENABLE_TRITON=OFF \
            -DTENET_ENABLE_YARA=ON \
            -DTENET_ENABLE_WS=ON \
            -DTENET_BUILD_TESTS=ON

      - name: Build
        working-directory: slowmo
        run: ninja -C build -j$(nproc)

      - name: Test
        working-directory: slowmo/build
        run: ctest --output-on-failure -j$(nproc)

  macos:
    runs-on: macos-14
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install ninja ccache yara

      - name: Cache ccache
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-slowmo-macos-${{ github.run_number }}
          restore-keys: |
            ccache-slowmo-macos-

      - name: Cache slowmo third-party (_deps)
        uses: actions/cache@v4
        with:
          path: slowmo/_deps
          key: slowmo-deps-v2-macos-${{ hashFiles('slowmo/CMakeLists.txt', 'slowmo/tests/CMakeLists.txt') }}

      - name: Configure
        working-directory: slowmo
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTENET_ENABLE_TRITON=OFF \
            -DTENET_ENABLE_YARA=ON \
            -DTENET_ENABLE_WS=ON \
            -DTENET_BUILD_TESTS=ON

      - name: Build
        working-directory: slowmo
        run: ninja -C build -j$(sysctl -n hw.ncpu)

      - name: Test
        working-directory: slowmo/build
        run: ctest --output-on-failure -j$(sysctl -n hw.ncpu)

  windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache sccache
        uses: actions/cache/restore@v4
        id: cache-sccache
        with:
          path: C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: sccache-slowmo-win-${{ github.run_number }}
          restore-keys: |
            sccache-slowmo-win-

      - name: Install sccache
        run: choco install sccache --no-progress -y

      - name: Cache slowmo third-party (_deps)
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: slowmo/_deps
          key: slowmo-deps-v2-win-${{ hashFiles('slowmo/CMakeLists.txt', 'slowmo/tests/CMakeLists.txt') }}

      - name: Configure
        working-directory: slowmo
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DTENET_ENABLE_TRITON=OFF `
            -DTENET_ENABLE_YARA=OFF `
            -DTENET_ENABLE_WS=OFF `
            -DTENET_BUILD_TESTS=ON

      - name: Build
        working-directory: slowmo
        run: ninja -C build

      - name: Test
        working-directory: slowmo/build
        run: ctest --output-on-failure -C RelWithDebInfo

      - name: Save sccache
        if: always() && steps.cache-sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: ${{ steps.cache-sccache.outputs.cache-primary-key }}

      - name: Save slowmo third-party (_deps)
        if: always() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: slowmo/_deps
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}

  dashcam-host:
    # qbditrace's host-test build (QBDITRACE_BUILD_DYLIB=OFF) is the desktop
    # cross-platform surface — the tracer dylib/.so itself only ever targets
    # iOS/Android (see ios.yml/android.yml) and is out of scope here.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Cache qbditrace third-party (_deps)
        uses: actions/cache@v4
        with:
          path: dashcam/_deps
          key: qbditrace-deps-v2-${{ runner.os }}-${{ hashFiles('dashcam/CMakeLists.txt') }}

      - name: Configure
        working-directory: dashcam
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja \
            -DQBDITRACE_BUILD_DYLIB=OFF \
            -DQBDITRACE_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        working-directory: dashcam
        run: ninja -C build

      - name: Test
        working-directory: dashcam/build
        run: ctest --output-on-failure

  qbdi-patches:
    # Verifies the patch series in patches/qbdi/ still applies cleanly
    # against upstream QBDI at the pinned commit (patches/qbdi/PIN).
    # Catch bitrot early when re-basing the pin or editing patches.
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Clone QBDI at pinned commit
        run: |
          PIN_SHA="$(awk 'NR == 1 {print $1; exit}' patches/qbdi/PIN)"
          [[ "${PIN_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid QBDI PIN" >&2; exit 1; }
          git clone --filter=blob:none https://github.com/QBDI/QBDI.git qbdi
          cd qbdi
          git checkout "${PIN_SHA}"

      - name: Apply patch series
        run: |
          cd qbdi
          for p in ../patches/qbdi/*.patch; do
            echo "applying $(basename "$p")"
            git apply --check "$p"
            git apply "$p"
          done
          echo "patch series applies cleanly"
