name: Release

# Release pipeline — triggered by pushing a `v*` tag (e.g. `v0.1.0`).
#
# Produces:
#   1. Self-contained `tenet` CLI bundles for Linux/macOS/Windows.
#      Built in slowmo/build (fixed dir) at Release profile, then run through
#      the same sidecar-prep scripts the desktop app uses
#      (slowmo/web/src-tauri/scripts/prepare-sidecar*) so every non-system
#      shared library is bundled next to the binary with rewritten rpath
#      (@executable_path/lib on ELF/Mach-O, DLL-next-to-exe on Windows) and
#      third-party license notices are collected/validated.
#   2. The Tenet Tauri desktop app (.dmg / .AppImage / .deb / .rpm / .msi / .exe)
#      bundling the tenet backend as sidecar.
#   3. qbditrace shared libraries for Android arm64-v8a and iOS arm64.
#   4. A GitHub Release gathering all artifacts with generated notes.
#
# Feature flags mirror retrace.yml: Linux/macOS build with YARA+WS enabled and
# Triton disabled (no Triton package on runners); Windows core-only
# (Triton/YARA/WS default OFF).
#
# Tag builds restore the _deps/ccache caches warmed by CI runs on main
# (GitHub falls back to the default-branch cache scope for tag refs).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_DIR: C:\Users\runneradmin\AppData\Local\Mozilla\sccache

jobs:
  tenet-cli:
    name: tenet CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            cache_platform: linux
          - os: macos-14
            platform: macos-arm64
            cache_platform: macos
          - os: windows-latest
            platform: windows-x86_64
            cache_platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache patchelf libyara-dev liblz4-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache yara lz4

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # collect_licenses.py (run by prepare-sidecar*) invokes
      # `pnpm licenses list` and `cargo metadata` — both toolchains must be
      # present even though the CLI bundle itself is pure C++.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-cli-${{ matrix.platform }}-${{ hashFiles('slowmo/web/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: slowmo/web
        run: pnpm install --frozen-lockfile

      - name: Fetch cargo dependencies
        run: cargo fetch --locked --manifest-path slowmo/web/src-tauri/Cargo.toml

      - name: Cache slowmo third-party (_deps)
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: slowmo/_deps
          key: slowmo-release-deps-v1-${{ matrix.platform }}-${{ hashFiles('slowmo/CMakeLists.txt', 'slowmo/tests/CMakeLists.txt') }}
          restore-keys: |
            slowmo-release-deps-v1-${{ matrix.platform }}-
            slowmo-deps-v2-${{ matrix.cache_platform }}-

      - name: Cache compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: ccache-release-${{ matrix.platform }}-${{ github.run_number }}
          restore-keys: |
            ccache-release-${{ matrix.platform }}-
            ccache-slowmo-${{ matrix.cache_platform }}-
            sccache-slowmo-${{ matrix.cache_platform }}-

      - name: Configure slowmo
        shell: bash
        run: |
          mkdir -p slowmo/build
          extra_flags=(-DTENET_ENABLE_TRITON=OFF -DTENET_ENABLE_YARA=ON -DTENET_ENABLE_WS=ON)
          launcher=ccache
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra_flags=()
            launcher=sccache
          fi
          cmake -S slowmo -B slowmo/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER="$launcher" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            "${extra_flags[@]}"

      # prepare-sidecar* rebuild the tenet target at Release profile in the
      # same fixed build dir, then bundle the binary with its non-system
      # shared libraries + generated third-party license notices.
      - name: Build & bundle tenet (Linux)
        if: runner.os == 'Linux'
        run: bash slowmo/web/src-tauri/scripts/prepare-sidecar-linux.sh --release

      - name: Build & bundle tenet (macOS)
        if: runner.os == 'macOS'
        run: bash slowmo/web/src-tauri/scripts/prepare-sidecar.sh --release

      - name: Build & bundle tenet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File slowmo/web/src-tauri/scripts/prepare-sidecar-windows.ps1 -BuildType Release

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binaries=slowmo/web/src-tauri/binaries
          triple_bin=""
          for f in "${binaries}"/tenet-*; do
            if [ -f "$f" ]; then triple_bin="$f"; break; fi
          done
          [ -n "${triple_bin}" ] || { echo "sidecar binary not found"; exit 1; }
          mkdir -p pkg/tenet/lib
          cp "${triple_bin}" pkg/tenet/tenet
          chmod +x pkg/tenet/tenet
          if [ -d "${binaries}/lib" ] && [ -n "$(ls -A "${binaries}/lib" 2>/dev/null)" ]; then
            cp -R "${binaries}/lib/." pkg/tenet/lib/
          else
            rmdir pkg/tenet/lib
          fi
          cp -R slowmo/rules pkg/tenet/rules
          if [ -d "${binaries}/licenses" ]; then cp -R "${binaries}/licenses" pkg/tenet/licenses; fi
          cp LICENSE README.md pkg/tenet/
          mkdir -p dist
          tar -czf "dist/retrace-tenet-${{ matrix.platform }}.tar.gz" -C pkg tenet
          echo "--- bundle contents ---"
          tar -tzf "dist/retrace-tenet-${{ matrix.platform }}.tar.gz" | sed -n '1,30p'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = 'slowmo/web/src-tauri/binaries'
          $tripleBin = Get-ChildItem $binaries -Filter 'tenet-*' -File | Select-Object -First 1
          if ($null -eq $tripleBin) { throw 'sidecar binary not found' }
          New-Item -ItemType Directory -Force pkg/tenet | Out-Null
          Copy-Item $tripleBin.FullName 'pkg/tenet/tenet.exe'
          Copy-Item "$binaries/*.dll" 'pkg/tenet/' -ErrorAction SilentlyContinue
          Copy-Item -Recurse slowmo/rules 'pkg/tenet/rules'
          if (Test-Path "$binaries/licenses") { Copy-Item -Recurse "$binaries/licenses" 'pkg/tenet/licenses' }
          Copy-Item LICENSE 'pkg/tenet/'
          Copy-Item README.md 'pkg/tenet/'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path pkg/tenet -DestinationPath "dist/retrace-tenet-${{ matrix.platform }}.zip"
          Get-ChildItem dist

      - name: Check packaged CLI startup (Linux/macOS)
        if: runner.os != 'Windows'
        run: pkg/tenet/tenet --help

      - name: Check packaged CLI startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./pkg/tenet/tenet.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed: $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenet-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - name: Save compiler cache
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Save release dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: slowmo/_deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  desktop:
    name: Desktop app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            cache_platform: macos
          - os: ubuntu-latest
            platform: linux-x86_64
            cache_platform: linux
          - os: windows-latest
            platform: windows-x86_64
            cache_platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: slowmo/web/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Registry only — caching target/ too would blow the 10 GB repo
          # cache budget across 3 OS (tauri builds produce multi-GB trees).
          # A cold cargo build of the tauri stack costs a few extra minutes.
          key: cargo-desktop-${{ matrix.platform }}-${{ hashFiles('slowmo/web/src-tauri/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache patchelf libyara-dev liblz4-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev file

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache yara lz4

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache slowmo third-party (_deps)
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: slowmo/_deps
          key: slowmo-release-deps-v1-${{ matrix.platform }}-${{ hashFiles('slowmo/CMakeLists.txt', 'slowmo/tests/CMakeLists.txt') }}
          restore-keys: |
            slowmo-release-deps-v1-${{ matrix.platform }}-
            slowmo-deps-v2-${{ matrix.cache_platform }}-

      - name: Cache compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: ccache-desktop-${{ matrix.platform }}-${{ github.run_number }}
          restore-keys: |
            ccache-desktop-${{ matrix.platform }}-
            ccache-slowmo-${{ matrix.cache_platform }}-
            sccache-slowmo-${{ matrix.cache_platform }}-

      - name: Configure slowmo
        shell: bash
        run: |
          mkdir -p slowmo/build
          extra_flags=(-DTENET_ENABLE_TRITON=OFF -DTENET_ENABLE_YARA=ON -DTENET_ENABLE_WS=ON)
          launcher=ccache
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra_flags=()
            launcher=sccache
          fi
          cmake -S slowmo -B slowmo/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER="$launcher" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            "${extra_flags[@]}"

      - name: Install frontend dependencies
        working-directory: slowmo/web
        run: pnpm install --frozen-lockfile

      # Populates ~/.cargo/registry so `cargo metadata --offline` inside
      # collect_licenses.py works on a cold cache.
      - name: Fetch cargo dependencies
        run: cargo fetch --locked --manifest-path slowmo/web/src-tauri/Cargo.toml

      # Reuses the same sidecar pipeline as the CLI job, then packages the
      # Tauri app (.dmg / .AppImage + .deb + .rpm / .msi + NSIS .exe).
      - name: Build desktop app
        working-directory: slowmo/web
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          pnpm sidecar --release
          pnpm exec tauri build

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: slowmo/web/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            slowmo/web/src-tauri/target/release/bundle/appimage/*.AppImage
            slowmo/web/src-tauri/target/release/bundle/deb/*.deb
            slowmo/web/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            slowmo/web/src-tauri/target/release/bundle/nsis/*.exe
            slowmo/web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Save compiler cache
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Save release dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: slowmo/_deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  qbditrace:
    name: qbditrace (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android-arm64-v8a
            target: android
          - os: macos-14
            platform: ios-arm64
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android NDK
        if: matrix.target == 'android'
        run: |
          sdkmanager 'ndk;27.2.12479018'
          echo "NDK_PATH=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache patched QBDI static libraries
        id: qbdi-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third-party/qbdi/${{ matrix.target }}/libQBDI.a
            third-party/qbdi/${{ matrix.target }}/libqbdi-llvm.a
            third-party/qbdi/${{ matrix.target }}/include
            third-party/qbdi/${{ matrix.target }}/build-include
          key: qbdi-mobile-v1-${{ matrix.platform }}-ndk27c-${{ hashFiles('patches/qbdi/**', 'scripts/prepare-qbdi.sh') }}

      - name: Build patched QBDI
        if: steps.qbdi-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare-qbdi.sh ${{ matrix.target }}

      - name: Save patched QBDI static libraries
        if: steps.qbdi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third-party/qbdi/${{ matrix.target }}/libQBDI.a
            third-party/qbdi/${{ matrix.target }}/libqbdi-llvm.a
            third-party/qbdi/${{ matrix.target }}/include
            third-party/qbdi/${{ matrix.target }}/build-include
          key: ${{ steps.qbdi-cache.outputs.cache-primary-key }}

      - name: Fetch zstd sources
        run: |
          cmake -S dashcam -B dashcam/build -G Ninja \
            -DQBDITRACE_BUILD_DYLIB=OFF -DQBDITRACE_BUILD_TESTS=OFF

      - name: Build Android shared library
        if: matrix.target == 'android'
        run: |
          bash dashcam/build-dashcam-android.sh
          file libqbditrace.so
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -d libqbditrace.so

      - name: Build iOS dynamic library
        if: matrix.target == 'ios'
        run: |
          bash dashcam/build-dashcam-ios.sh
          codesign --force --sign - libqbditrace.dylib
          file libqbditrace.dylib
          xcrun lipo libqbditrace.dylib -verify_arch arm64
          otool -L libqbditrace.dylib

      - name: Package mobile library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist pkg/qbditrace
          if [ '${{ matrix.target }}' = android ]; then
            lib=libqbditrace.so
          else
            lib=libqbditrace.dylib
          fi
          mkdir -p pkg/qbditrace/licenses
          pin=$(awk 'NR == 1 {print $1; exit}' patches/qbdi/PIN)
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/QBDI/QBDI/${pin}/LICENSE.txt" -o pkg/qbditrace/licenses/QBDI.txt
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-19.1.5/llvm/LICENSE.TXT" -o pkg/qbditrace/licenses/LLVM.txt
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/gabime/spdlog/v1.15.0/LICENSE" -o pkg/qbditrace/licenses/spdlog.txt
          cp dashcam/_deps/zstd-src/LICENSE pkg/qbditrace/licenses/zstd-LICENSE
          cp dashcam/_deps/zstd-src/COPYING pkg/qbditrace/licenses/zstd-COPYING
          cp "$lib" dist/
          cp "$lib" LICENSE dashcam/README.md pkg/qbditrace/
          cp dashcam/TraceFormat.h pkg/qbditrace/
          tar -czf "dist/retrace-qbditrace-${{ matrix.platform }}.tar.gz" -C pkg qbditrace

      - uses: actions/upload-artifact@v4
        with:
          name: qbditrace-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tenet-cli, desktop, qbditrace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
